# Muster stack.
#
# A bare `docker compose up -d` starts the core dependency services (db, redis).
# Optional services are gated behind profiles — activate them explicitly:
#
#   docker compose --profile daemon up -d     # daemon
#   docker compose --profile cli up -d        # one-off CLI commands
#   docker compose --profile mcp up -d        # MCP server
#   docker compose --profile dev up -d        # db, redis, cli, mcp-server
#   docker compose --profile monitoring up -d # api, prometheus, grafana
#   docker compose --profile proxy up -d      # api, nginx (needs ./ssl certs)
#   docker compose --profile prod up -d       # api, daemon, nginx, prometheus, grafana
#   docker compose --profile full up -d       # everything
#
# Host port overrides: every published host port is owned by a MUSTER_*_PORT
# environment variable and keeps its historical value as the default. On a
# host that already runs postgres, redis, grafana or anything else on the
# same port, remap the stack without editing this file:
#
#   MUSTER_DB_PORT=15432 MUSTER_REDIS_PORT=16379 docker compose up -d
#
# Or persist them in a `.env` file next to this compose file:
#
#   MUSTER_DB_PORT=15432
#   MUSTER_REDIS_PORT=16379
#
# Full variable reference:
#
#   MUSTER_API_HTTP_PORT      (default 8080)   api HTTP listener
#   MUSTER_API_METRICS_PORT   (default 9090)   api metrics listener
#   MUSTER_DAEMON_PORT        (default 8081)   daemon HTTP listener
#   MUSTER_DB_PORT            (default 5432)   postgres
#   MUSTER_REDIS_PORT         (default 6379)   redis
#   MUSTER_PROMETHEUS_PORT    (default 9091)   prometheus UI
#   MUSTER_GRAFANA_PORT       (default 3000)   grafana UI
#   MUSTER_NGINX_HTTP_PORT    (default 80)     nginx HTTP
#   MUSTER_NGINX_HTTPS_PORT   (default 443)    nginx HTTPS
#
# Only the HOST side is remapped; container-side ports are fixed (services
# reach each other over the muster-network by container port, and the
# DATABASE_URL/REDIS_URL service URLs are unaffected by host-side overrides).
#
# Profile dependency note: any service whose depends_on targets are not active
# under a profile alone makes that profile an invalid compose project, so every
# profile here is dependency-closed (guarded by TestComposeProfileDependencyClosure).
services:
  # Core API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: muster/api:${VERSION:-latest}
    ports:
      - "${MUSTER_API_HTTP_PORT:-8080}:8080"
      - "${MUSTER_API_METRICS_PORT:-9090}:9090"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/muster
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - METRICS_PORT=9090
      - OPENAPICLI_LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/openapi-cli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - muster-network
    profiles:
      - full
      - prod
      - monitoring
      - proxy

  # CLI service for one-off commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: muster/cli:${VERSION:-latest}
    container_name: muster-cli
    volumes:
      - ~/.config/muster:/home/nonroot/.config/muster
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OPENAPICLI_LOG_LEVEL=info
      - OPENAPICLI_CONFIG_PATH=/home/nonroot/.config/muster
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/muster
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    command: ["version"]
    networks:
      - muster-network
    profiles:
      - cli
      - dev
      - full

  # Daemon mode
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: muster/daemon:${VERSION:-latest}
    container_name: muster-daemon
    ports:
      - "${MUSTER_DAEMON_PORT:-8081}:8080"
    volumes:
      - ~/.config/muster:/home/nonroot/.config/muster
    environment:
      - OPENAPICLI_MODE=daemon
      - OPENAPICLI_DAEMON_SOCKET=0.0.0.0:8080
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/muster
      - REDIS_URL=redis://redis:6379
      - OPENAPICLI_LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["daemon", "start"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/openapi-cli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - muster-network
    profiles:
      - daemon
      - full
      - prod

  # MCP Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: muster/mcp-server:${VERSION:-latest}
    container_name: muster-mcp-server
    entrypoint: ["/usr/local/bin/openapi-mcp"]
    command: ["--help"]
    volumes:
      - ~/.config/muster:/home/nonroot/.config/muster
    environment:
      - OPENAPICLI_LOG_LEVEL=debug
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/muster
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - muster-network
    profiles:
      - mcp
      - full
      - dev

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: muster-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: muster
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${MUSTER_DB_PORT:-5432}:5432"
    networks:
      - muster-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: muster-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MUSTER_REDIS_PORT:-6379}:6379"
    networks:
      - muster-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: muster-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./deployments/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${MUSTER_PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - api
    networks:
      - muster-network
    profiles:
      - monitoring
      - full
      - prod

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: muster-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${MUSTER_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - muster-network
    profiles:
      - monitoring
      - full
      - prod

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: muster-nginx
    ports:
      - "${MUSTER_NGINX_HTTP_PORT:-80}:80"
      - "${MUSTER_NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - muster-network
    profiles:
      - proxy
      - full
      - prod

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  muster-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
