# Docker Compose Test Configuration
# Tests the full stack without building images

name: muster-test

services:
  # Test PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: muster-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: muster
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "15432:5432"
    networks:
      - muster-test-network

  # Test Redis
  redis:
    image: redis:7-alpine
    container_name: muster-test-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "16379:6379"
    networks:
      - muster-test-network

  # Test Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: muster-test-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./deployments/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_test_data:/prometheus
    ports:
      - "19091:9090"
    depends_on:
      - db
    networks:
      - muster-test-network

  # Test Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: muster-test-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_test_data:/var/lib/grafana
    ports:
      - "13000:3000"
    depends_on:
      - prometheus
    networks:
      - muster-test-network

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local
  prometheus_test_data:
    driver: local
  grafana_test_data:
    driver: local

networks:
  muster-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
