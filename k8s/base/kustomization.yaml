apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openapi-cli

namePrefix: openapi-cli-
commonLabels:
  app.kubernetes.io/name: openapi-cli
  app.kubernetes.io/part-of: openapi-cli
  app.kubernetes.io/managed-by: kubectl

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

images:
  - name: openapi-cli
    newName: ghcr.io/openapi-cli/openapi-cli
    newTag: "1.0.0"
