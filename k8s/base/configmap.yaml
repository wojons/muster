apiVersion: v1
kind: ConfigMap
metadata:
  name: openapi-cli-config
  namespace: openapi-cli
  labels:
    app.kubernetes.io/name: openapi-cli
    app.kubernetes.io/component: config
data:
  config.yaml: |
    server:
      port: 8080
      host: 0.0.0.0

    log:
      level: info
      format: json
      output: stdout

    inventory:
      cache_ttl: 300
      fetch_timeout: 30s

    http:
      timeout: 30s
      max_retries: 3
      retry_backoff: exponential

    rate_limit:
      enabled: true
      requests_per_minute: 100
      burst: 10

    metrics:
      enabled: true
      path: /metrics

    health:
      enabled: true
      path: /health

    tracing:
      enabled: true
      endpoint: "http://jaeger:14268/api/traces"
      sample_rate: 0.1
