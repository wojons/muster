apiVersion: v1
kind: Service
metadata:
  name: openapi-cli
  namespace: openapi-cli
  labels:
    app.kubernetes.io/name: openapi-cli
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: openapi-cli
    app.kubernetes.io/component: server
  sessionAffinity: None
