apiVersion: v1
kind: ResourceQuota
metadata:
  name: openapi-cli-quota
  namespace: openapi-cli-prod
  labels:
    app.kubernetes.io/name: openapi-cli
    app.kubernetes.io/component: resourcequota
    environment: production
spec:
  hard:
    # Compute resources
    requests.cpu: "5000m"
    requests.memory: 10Gi
    limits.cpu: "20000m"
    limits.memory: 40Gi
    
    # Storage resources
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    
    # Object counts
    pods: "20"
    services: "5"
    secrets: "20"
    configmaps: "10"
    replicationcontrollers: "0"
    
    # LoadBalancer services
    services.loadbalancers: "1"
    services.nodeports: "0"
    
    # Network policies
    count/networkpolicies.networking.k8s.io: "5"
    
    # PodDisruptionBudgets
    count/poddisruptionbudgets.policy: "2"
    
    # HorizontalPodAutoscalers
    count/horizontalpodautoscalers.autoscaling: "2"
