apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openapi-cli-prod

namePrefix: prod-

resources:
  - ../../base
  - resourcequota.yaml
  - limitrange.yaml
  - certmanager-certificate.yaml
  - ingress.yaml
  - argocd-application.yaml

patches:
  - target:
      kind: Deployment
      name: openapi-cli
    path: deployment-patch.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: openapi-cli
    path: hpa-patch.yaml
  - target:
      kind: PodDisruptionBudget
      name: openapi-cli
    path: pdb-patch.yaml

labels:
  - pairs:
      app.kubernetes.io/name: openapi-cli
      app.kubernetes.io/component: server
      app.kubernetes.io/version: "1.0.0"
      app.kubernetes.io/part-of: openapi-cli
      app.kubernetes.io/managed-by: kustomize
      environment: production
    includeSelectors: true

images:
  - name: ghcr.io/openapi-cli/openapi-cli
    newTag: "1.0.0"

commonAnnotations:
  contact: "ops@example.com"
  cost-center: "platform-engineering"
  backup.velero.io/backup-volumes: cache,tmp
