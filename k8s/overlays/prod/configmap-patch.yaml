server:
  host: 0.0.0.0
  port: 8080
  tls:
    enabled: true
    cert: /etc/tls/tls.crt
    key: /etc/tls/tls.key

logging:
  level: info
  format: json
  output: stdout

metrics:
  enabled: true
  path: /metrics
  port: 8080

tracing:
  enabled: true
  exporter: otlp
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  service_name: openapi-cli
  sample_rate: 0.1

cache:
  type: redis
  ttl: 3600
  redis:
    addr: redis-master.cache.svc.cluster.local:6379
    password: ${REDIS_PASSWORD}
    db: 0
    pool_size: 10

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 150

security:
  cors:
    allowed_origins:
      - https://api.example.com
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
  auth:
    required: true
    providers:
      - oauth2
      - api_key
