apiVersion: v1
kind: LimitRange
metadata:
  name: openapi-cli-limits
  namespace: openapi-cli-prod
  labels:
    app.kubernetes.io/name: openapi-cli
    app.kubernetes.io/component: limitrange
    environment: production
spec:
  limits:
    - default:
        memory: 512Mi
        cpu: 500m
      defaultRequest:
        memory: 128Mi
        cpu: 100m
      max:
        memory: 2Gi
        cpu: 2000m
      min:
        memory: 64Mi
        cpu: 50m
      type: Container
    - max:
        storage: 10Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim
