              spec_ref: "specs/SECURITY-TESTING.md"
              inputs:
                expected_files: "pkg/platform/seccomp_sandbox_test.go"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSeccomp_E2E_RuntimeBlocks ./pkg/platform/ 2>&1 | tail -20"
                  required: true
                  timeout_seconds: 120
            - id: "step-4-1-2"
              title: "Add SELinux context round-trip integration test"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#6-security"
              inputs:
                expected_files: "pkg/platform/selinux_test.go"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSELinux_RoundTrip ./pkg/platform/ 2>&1 | tail -20"
                  required: true
                  timeout_seconds: 120
        - id: "task-4-2"
          title: "Full validation pass"
          steps:
            - id: "step-4-2-1"
