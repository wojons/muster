              verification:
                - type: "command"
                  command: "go vet ./pkg/platform/ 2>&1"
                  required: true
                  timeout_seconds: 60
            - id: "step-1-2-2"
              title: "Add doc link to Apply() alternative"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
                expected_files: "pkg/platform/seccomp.go"
              verification:
                - type: "command"
                  command: "go vet ./pkg/platform/ 2>&1"
                  required: true
                  timeout_seconds: 60
        - id: "task-1-3"
          title: "Wire lastFailedSyscall recording"
          steps:
            - id: "step-1-3-1"
              title: "Add recordFailedSyscall helper"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
