                - type: "command"
                  command: "go build ./pkg/platform/ 2>&1"
                  required: true
                  timeout_seconds: 60
            - id: "step-1-3-2"
              title: "Wire recordFailedSyscall into AllowSyscall/DenySyscall failures"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
                expected_files: "pkg/platform/seccomp.go"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSeccomp_SyscallNumberConversion ./pkg/platform/ 2>&1 | tail -20"
                  required: true
                  timeout_seconds: 120
            - id: "step-1-3-3"
              title: "Add TestSeccomp_RecordFailedSyscall test"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSeccomp_RecordFailedSyscall ./pkg/platform/ 2>&1 | tail -20"
                  required: true
