version: 1
work_item:
  id: "prod-readiness-01-fix-linux-security-sec"
  jira_key: null
  repo: "anomalyco/muster"
  pr_branch: "axiom/prod-readiness-01-fix-linux-security-sec"
meta_planning:
  notes_md_path: ".memory-bank/work-items/prod-readiness-01-fix-linux-security-sec/meta-planning.md"
plan:
  phases:
    - id: "phase-1"
      title: "Seccomp Defect Fixes"
      tasks:
        - id: "task-1-1"
          title: "Fix LimitFileAccess allowedPaths handling"
          steps:
            - id: "step-1-1-1"
              title: "Audit LimitFileAccess — verify allowedPaths is never read"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
                expected_files: "pkg/platform/seccomp.go"
              verification:
                - type: "command"
                  command: "grep -n 'allowedPaths' pkg/platform/seccomp.go"
                  required: true
                  timeout_seconds: 30
            - id: "step-1-1-2"
              title: "Rewrite LimitFileAccess to iterate allowedPaths"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
                expected_files: "pkg/platform/seccomp.go"
              verification:
                - type: "qa_agent"
                  command: "/axiom-verify"
                  required: true
                  timeout_seconds: 120
            - id: "step-1-1-3"
              title: "Add TestSeccompFilter_LimitFileAccess_RespectsPaths"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
                expected_files: "pkg/platform/seccomp_sandbox_test.go"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSeccompFilter_LimitFileAccess ./pkg/platform/ 2>&1 | tail -20"
                  required: true
                  timeout_seconds: 120
        - id: "task-1-2"
          title: "ApplyToProcess disposition"
          steps:
            - id: "step-1-2-1"
              title: "Replace hardcoded failure with doc comment"
              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#security"
              inputs:
