              command: "/axiom-step"
              spec_ref: "specs/PLATFORM-LINUX.md#6-security"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestSELinux_GetFileContext_Robust ./pkg/platform/ 2>&1 | tail -20"
