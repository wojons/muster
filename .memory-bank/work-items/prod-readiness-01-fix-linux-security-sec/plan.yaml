                  required: true
                  timeout_seconds: 60
            - id: "step-3-1-2"
              title: "Implement Retrieve/Delete/List using D-Bus search"
              command: "/axiom-step"
              spec_ref: "specs/LINUX-IMPLEMENTATION.md#2-secret-service"
              inputs:
                expected_files: "pkg/platform/secure_storage.go"
              verification:
                - type: "command"
                  command: "go build ./pkg/platform/ 2>&1"
                  required: true
                  timeout_seconds: 60
            - id: "step-3-1-3"
