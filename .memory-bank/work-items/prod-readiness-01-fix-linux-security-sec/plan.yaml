              command: "/axiom-step"
              spec_ref: "specs/LINUX-IMPLEMENTATION.md#2-secret-service"
              verification:
                - type: "command"
                  command: "go test -v -count=1 -run TestLinuxKeychain ./pkg/platform/ 2>&1 | tail -30"
