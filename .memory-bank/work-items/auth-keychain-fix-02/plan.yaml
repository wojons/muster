              command: "go test -v -run TestFileKeychain ./pkg/auth/"
              spec_ref: "pkg/auth/keychain.go#L546-L586"
              inputs: {}
              verification:
                - type: "command"
                  command: "go test -count=1 ./pkg/auth/... 2>&1 | grep -E '^(ok|FAIL)'"
