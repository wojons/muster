              command: "go test -v -run 'TestFileKeychain_NoWeakOSFallback' ./pkg/auth/"
              spec_ref: "pkg/auth/keychain.go#L339-L374"
              inputs: {}
              verification:
                - type: "command"
                  command: "go test -v -run TestFileKeychain ./pkg/auth/"
                  required: true
                  timeout_seconds: 60
    - id: "phase-3"
