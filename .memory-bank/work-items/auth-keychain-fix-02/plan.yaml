              command: "/axiom-step"
              spec_ref: "pkg/auth/keychain.go#L496-L586"
              inputs: {}
              verification:
                - type: "command"
                  command: "go test -v -run 'TestWindowsKeychain_Set|TestFileKeychain_SecureMasterKeyGeneration' ./pkg/auth/"
                  required: true
                  timeout_seconds: 60
