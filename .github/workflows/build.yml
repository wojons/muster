name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Install dependencies
        run: make deps
      
      - name: Generate code
        run: make generate
      
      - name: Run tests
        run: make test-short
      
      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          # Pin explicitly — `version: latest` resolves to v1.64.8 (built
          # with go1.24), which cannot target go1.26 ("Go language version
          # used to build golangci-lint is lower than the targeted Go version").
          # Action v7 required: v3 passes --out-format=github-actions, which
          # golangci-lint v2 removed (renamed --output.formats).
          version: v2.12.2

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Install dependencies
        run: make deps
      
      - name: Generate code
        run: make generate
      
      - name: Build binary
        run: make build
      
      - name: Run integration tests
        run: make test-integration
      
      - name: Run E2E tests
        run: make test-e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Run security tests
        run: make test-security

      - name: Run dependency vulnerability scan
        run: make deps-audit

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Build Docker image for scanning
        run: docker build -t muster:scan . || echo "Docker build skipped — no daemon available"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'muster:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install system dependencies
        if: matrix.platform.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Build
        env:
          GOOS: ${{ matrix.platform.os }}
          GOARCH: ${{ matrix.platform.arch }}
          # Cross-compilation must not use cgo: the project has no cgo
          # sources, and with CGO_ENABLED=1 the host gcc (amd64) tries to
          # assemble runtime/cgo for the target arch and fails
          # (gcc_arm64.S assembler errors on linux/arm64).
          CGO_ENABLED: 0
        run: make build

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ./scripts/release.sh "$VERSION"
      
      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
