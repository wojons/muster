name: Cross-Platform Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-matrix:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']
        # windows-latest runs Go 1.27 instead: Go 1.26.x on windows/amd64
        # corrupts the goroutine stack during overlapped socket I/O (the kernel
        # writes an output parameter into a stack slot that has already been
        # reused), which surfaces as a whole-package crash and not a test
        # failure — `Exception 0xc0000005 ...` / `runtime: g N ...: unknown pc`
        # in pkg/protocol/grpc and `fatal error: unexpected signal during
        # runtime execution` inside the GC in internal/builtin.
        # Upstream: golang/go#77975 (fixed by CL 753040 + CL 753560), closed
        # with milestone Go1.27; go1.26.8 does not contain either change.
        # INT-CI-004. Drop the exclude/include pair once the toolchain the
        # repo targets is >= 1.27.
        exclude:
          - os: windows-latest
        include:
          - os: windows-latest
            go-version: '1.27'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Install dependencies
        run: make deps
      
      - name: Generate code
        run: make generate
      
      - name: Run tests
        run: go test -short -count=1 $(go list ./... | grep -v -e test/stability -e pkg/platform -e test/security)

      - name: Run unit tests
        if: matrix.os != 'windows-latest'
        run: make test-unit

      - name: Run integration tests
        if: matrix.os != 'windows-latest'
        run: make test-integration

      - name: Run E2E tests
        if: matrix.os != 'windows-latest'
        run: make test-e2e

      - name: Build all binaries
        run: make build-all
  
  platform-specific-tests:
    name: Platform-Specific Tests (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-SELinux
            os: ubuntu-latest
            test-pattern: ".*SELinux.*"
          - name: macOS-Keychain
            os: macos-latest
            test-pattern: ".*Keychain.*"
          - name: Windows-Credential
            os: windows-latest
            test-pattern: ".*Windows.*Credential.*"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Install dependencies
        run: make deps
      
      - name: Run platform-specific tests
        run: go test -v -run "${{ matrix.platform.test-pattern }}" ./... || echo "Platform-specific tests may require special setup"
  
  arm64-tests:
    name: ARM64 Compatibility (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install dependencies
        run: make deps
      
      - name: Build for ARM64
        run: GOOS=darwin GOARCH=arm64 make build
      
      - name: Run tests on ARM64
        run: go test -short -count=1 $(go list ./... | grep -v -e test/stability -e pkg/platform -e test/security)
  
  path-separator-tests:
    name: Windows Path Separator Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install dependencies
        run: make deps
      
      - name: Run path-related tests
        run: go test -v -run ".*[Pp]ath.*" ./...
  
  socket-permission-tests:
    name: Linux Socket Permission Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Install dependencies
        run: make deps
      
      - name: Run socket-related tests
        run: go test -v -run ".*[Ss]ocket.*" ./...
      
      - name: Run daemon tests
        run: go test -v ./cmd/daemon/... -count=1
