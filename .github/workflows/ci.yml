name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flask
        run: pip install flask

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Build
        run: go build ./...

      - name: Version guard (no binary may report dev)
        run: |
          make build-all
          for b in ./bin/openapi-cli ./bin/openapi-mcp ./bin/openapi-daemon; do
            out="$("$b" --version)"
            case "$out" in
              *"dev (unknown)"*|"") echo "FAIL: $b reports '$out'"; exit 1;;
            esac
            echo "OK: $b -> $out"
          done

      - name: Test
        run: go test -short -count=1 $(go list ./... | grep -v -e test/stability -e test/security)

      - name: Test (seccomp-tagged platform package)
        run: go test -short -count=1 -tags seccomp ./pkg/platform/...

      - name: Demo
        run: ./demo/run-all.sh

      # QA-MUSTER-024: a compose file that fails `docker compose config`
      # never reaches the operator — catch the whole class in CI instead of
      # discovering it while deploying the hardened stack.
      - name: Validate compose files
        run: bash ./scripts/validate-compose.sh
