# AlertManager Configuration for Muster
# Reference: specs/OPS-ALERTING.md

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@muster.io'
  smtp_auth_username: 'alerts@muster.io'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  slack_api_url: '${SLACK_WEBHOOK_URL:-}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']
  
  # Wait 30s before sending initial notification (allows batching)
  group_wait: 30s
  
  # Wait 5m before sending updates for the same group
  group_interval: 5m
  
  # Repeat notifications every 4h
  repeat_interval: 4h
  
  # Sub-routes based on severity
  routes:
    # Critical alerts -> PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'pagerduty'
      continue: true
    
    # Warning alerts -> Slack
    - match:
        severity: warning
      receiver: 'slack'
      continue: true
    
    # Info alerts -> Email only (default receiver)
    - match:
        severity: info
      receiver: 'default'

# Receivers define how notifications are sent
receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@muster.io'
        send_resolved: true
        headers:
          Subject: '[Muster Alert] {{ .GroupLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3>{{ .Annotations.summary }}</h3>
          <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .Annotations.runbook_url }}
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">View</a></p>
          {{ end }}
          {{ end }}

  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          {{ range .Alerts }}
          {{ if eq .Labels.severity "critical" }}🔥{{ else if eq .Labels.severity "warning" }}⚠️{{ else }}ℹ️{{ end }} *{{ .Labels.severity | toUpper }}*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        actions:
          - type: button
            text: 'View Runbook'
            url: '{{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}'

  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY:-}'
        severity: '{{ .Labels.severity }}'
        description: '{{ .Annotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'

# Inhibit rules - prevent spam during outages
# If critical alert fires, suppress warning for same alert/service
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
