# Docker Compose Development Configuration
# Based on specs/DOCKER-COMPOSE.md

name: muster-dev

services:
  # Development database
  postgres:
    image: postgres:16-alpine
    container_name: muster-dev-postgres
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster_dev
      POSTGRES_DB: muster_test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - muster-dev-network

  # Development cache
  redis:
    image: redis:7-alpine
    container_name: muster-dev-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - muster-dev-network

  # Hot reload development server
  dev-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: muster-dev-server
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: ["air", "-c", ".air.toml"]
    environment:
      - ENV=development
      - LOG_LEVEL=debug
      - DATABASE_URL=postgres://muster:muster_dev@postgres:5432/muster_test
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - muster-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local

networks:
  muster-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
