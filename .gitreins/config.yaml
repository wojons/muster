guards:
  go:
    build: true
    lint: true
    tests: true
  lint: true
  lsp: true
  lsp_tools:
  - gopls
  secrets: true
  test_command: go test -short -count=1 $(go list ./... | grep -v -e test/stability -e pkg/platform -e test/security)
  test_mode: full
  test_timeout: 600
  hook_timeout: 900
  tests: true
evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: "45m"
  max_input_tokens: "10M"
  max_output_tokens: "2M"
  tool_call_weight: 0.1
  file_scope: full
  fast_track: auto

pipeline:
  stages:
    - id: tier1
      parallel: false
      on: [pre-commit, pre-eval]
      steps:
        - id: secrets
          type: script
          run: "gitleaks detect --source . --no-git || python3 -c \"from engine.guard_manager import GuardManager; import sys; gm = GuardManager('.'); r = gm._check_secrets(); sys.exit(0 if r.passed else 1)\""
          on_fail: continue
        - id: lint
          type: script
          run: go vet ./...
          timeout: 300
        - id: tests
          type: script
          run: go test -short -count=1 $(go list ./... | grep -v -e test/stability -e pkg/platform -e test/security)
          timeout: 600
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: -1
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  max_verdicts: 1000
  storage: git
