guards:
  go:
    build: true
    lint: true
    tests: true
  lint: true
  lsp: true
  lsp_tools:
  - gopls
  secrets: true
  test_command: go test -short -count=1 $(go list ./... | grep -v test/stability)
  test_mode: full
  tests: true
evaluator:
  max_iterations: 50
  max_time: 10m
  max_input_tokens: 0.2M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  max_verdicts: 1000
  storage: git
