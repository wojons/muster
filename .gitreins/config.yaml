guards:
  test_mode: full
  secrets: true
  lint: true
  tests: true
  test_command: go test -short -count=1 ./...
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 25
  max_time: 5m
  max_output_tokens: 200k
  tool_call_weight: 0.1
defaults:
  model: deepseek-v4-flash
  check_for_updates: true
  update_check_ttl: 24h
history:
  enabled: true
  storage: git
  max_verdicts: 1000
