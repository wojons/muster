guards:
  go:
    build: true
    lint: true
    tests: true
  lint: true
  lsp: true
  lsp_tools:
  - gopls
  secrets: true
  test_command: go test -short -count=1 $(go list ./... | grep -v test/stability)
  test_mode: full
  test_timeout: 600
  hook_timeout: 900
  tests: true
evaluator:
  model: deepseek-v4-flash
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 1M
  max_output_tokens: 2M
  tool_call_weight: 0.1
  fast_track: auto
  file_scope: changed

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  max_verdicts: 1000
  storage: git
