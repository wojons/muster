guards:
  test_mode: full
  secrets: true
  lint: true
  tests: true
  lsp: true
  lsp_tools:
  - gopls
  test_command: go test -short -count=1 $(go list ./... | grep -v test/stability)
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 25
  max_time: 5m
  max_output_tokens: 200k
  tool_call_weight: 0.1
  code_context_budget: 0.70
  compaction_threshold: 0.90
defaults:
  model: deepseek-v4-flash
  check_for_updates: true
  update_check_ttl: 24h
history:
  enabled: true
  storage: git
  max_verdicts: 1000
