apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openapi-cli.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "openapi-cli.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.apiKey | default "" }}
  oauth-client-secret: {{ .Values.secrets.oauthClientSecret | default "" }}
  database-url: {{ .Values.secrets.databaseUrl | default "" }}
