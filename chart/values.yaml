replicaCount: 3

image:
  repository: ghcr.io/openapi-cli/openapi-cli
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.openapi-cli.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openapi-cli-tls
      hosts:
        - api.openapi-cli.io

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - openapi-cli
          topologyKey: kubernetes.io/hostname

config:
  server:
    port: 8080
    host: 0.0.0.0

  log:
    level: info
    format: json
    output: stdout

  inventory:
    cache_ttl: 300
    fetch_timeout: 30s

  http:
    timeout: 30s
    max_retries: 3
    retry_backoff: exponential

  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 10

  metrics:
    enabled: true
    path: /metrics

  health:
    enabled: true
    path: /health

  tracing:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1

secrets:
  apiKey: ""
  oauthClientSecret: ""
  databaseUrl: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  egressRules:
    enabled: true
